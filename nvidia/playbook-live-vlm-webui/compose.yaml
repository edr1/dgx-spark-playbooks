name: live-vlm

services:
  live-vlm-webui:
    image: ghcr.io/nvidia-ai-iot/live-vlm-webui:latest
    container_name: live-vlm-webui
    restart: unless-stopped
    network_mode: host
    environment:
      LIVE_VLM_API_BASE: http://localhost:11434/v1
      LIVE_VLM_DEFAULT_MODEL: gemma3:4b
      LIVE_VLM_PROCESS_EVERY: "60"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
